name: PHP lint

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/php-lint.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r php -l